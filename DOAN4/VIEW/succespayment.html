<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thành công</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: #fff;
            padding: 30px;
            max-width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #16a34a;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #0ea5a4;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Thanh toán thành công!</h2>
        <p>Cảm ơn bạn đã sử dụng dịch vụ</p>

        <button id="backBtn">Quay về</button>
    </div>

</body>
<script>
    document.getElementById("backBtn").addEventListener("click", function () {
        window.location.href = "index.html";
    });
</script>

</html>
